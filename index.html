<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111824"><meta name="apple-mobile-web-app-capable" content="yes"><title>每日成长</title><style>*{box-sizing:border-box}body{margin:0;background:#111824;color:#e9edf5;font:15px/1.65 system-ui,sans-serif}main{max-width:480px;margin:auto;padding:20px}h1{font-size:21px;font-weight:600;margin:0 0 10px}p{color:#b6c2d2;margin:10px 0;font-size:14px}article{background:#1b2534;border:1px solid #303d4e;border-radius:14px;padding:16px;margin:12px 0}article.done{border-color:#508e73}header,footer{display:flex;justify-content:space-between;align-items:center;gap:8px}strong{font-size:16px}small{color:#d9b77c;white-space:nowrap}.track{height:6px;background:#344052;border-radius:8px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#d9b77c}hr{border:0;border-top:1px solid #303d4e;margin:12px 0}button{font:inherit;background:#263449;color:#e9edf5;border:1px solid #435168;border-radius:9px;padding:10px 13px;cursor:pointer}button.checked{background:#214a3b;color:#b9ead3;border-color:#4d9177}.muted{color:#9ba9bc;font-size:12px}.task{font-size:14px;margin-bottom:3px}footer{margin:16px 0}#notice{font-size:12px;color:#9ba9bc}</style></head><body><main><h1>五项核心能力</h1><p>每天建议105分钟，忙碌时也可以只完成一项。</p><section id="cards"></section><footer><button id="change">更换学习任务</button><button id="reset">重置打卡</button></footer><p class="muted">成长不是一场短跑。保护健康、保持睡眠、持续学习。</p><div id="notice" role="status"></div></main><script>
const skills=[['🌍 英语沟通与商务谈判',98,30,'英语是通往全球就业市场的通行证。',['跟读10分钟商务英语','练习英文自我介绍','模拟海外客户沟通','学习10个行业英语词汇']],['💻 AI工具与Python自动化',92,25,'让技术放大你的时间和创造力。',['学习一个Python知识点','用AI解决一个实际问题','编写一个自动化脚本','研究一个AI商业应用']],['🤝 销售与客户开发',90,15,'学会发现需求、创造价值并获得订单。',['研究一个海外潜在客户','学习一个销售案例','模拟一次商务谈判','练习产品价值介绍']],['⚙️ 工程与跨行业技术',85,20,'从水利工程走向液冷、新能源和工业科技。',['研究一个储能系统案例','学习数据中心液冷原理','学习工业AI与数字孪生','练习有限元与流体仿真']],['📈 财务与投资能力',80,15,'守住本金，让财富长期积累。',['记录个人收支与储蓄','阅读一家公司的财报','学习一个估值指标','复盘投资决策与风险']]];
const key='daily-growth-v1',date=()=>{let d=new Date();return [d.getFullYear(),d.getMonth()+1,d.getDate()].join('-')};let state={date:date(),offset:0,done:Array(5).fill(false)},available=true;try{let s=JSON.parse(localStorage.getItem(key));if(s&&Array.isArray(s.done)&&s.done.length===5&&Number.isInteger(s.offset)&&s.offset>=0)state=s}catch(e){available=false}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){available=false}document.querySelector('#notice').textContent=available?'打卡自动保存，每天自动重置。':'当前浏览器不支持保存，打卡仅本次有效。'}function checkDay(){if(state.date!==date()){state={date:date(),offset:state.offset+1,done:Array(5).fill(false)};return true}return false}function render(){checkDay();document.querySelector('#cards').innerHTML=skills.map((s,i)=>`<article class="${state.done[i]?'done':''}"><header><strong>${s[0]}</strong><small>${s[1]}/100</small></header><p>${s[3]}</p><div class="track"><div class="fill" style="width:${s[1]}%"></div></div><hr><div class="task">今日任务：${s[4][state.offset%4]}</div><div class="muted">建议 ${s[2]} 分钟</div><p><button data-i="${i}" aria-pressed="${state.done[i]}" class="${state.done[i]?'checked':''}">${state.done[i]?'✓ 已完成':'完成打卡'}</button></p></article>`).join('');save()}document.querySelector('#cards').onclick=e=>{let b=e.target.closest('button[data-i]');if(!b)return;checkDay();let i=Number(b.dataset.i);state.done[i]=!state.done[i];render()};document.querySelector('#change').onclick=()=>{checkDay();state.offset++;state.done.fill(false);render()};document.querySelector('#reset').onclick=()=>{checkDay();state.done.fill(false);render()};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&checkDay())render()});setInterval(()=>{if(checkDay())render()},30000);render();</script></body></html>
